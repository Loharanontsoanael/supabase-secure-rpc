name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to a commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Start the local Supabase stack
        run: supabase start

      - name: Lint database functions
        run: supabase db lint --level warning --fail-on warning

      - name: Run pgTAP tests
        run: supabase test db

      - name: Check generated types are up to date
        run: |
          npm run types:gen
          git diff --exit-code -- src/database.types.ts

      - name: Type-check
        run: npm run typecheck

      - name: Run integration tests
        run: |
          npm run env:local
          npm test

      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup
